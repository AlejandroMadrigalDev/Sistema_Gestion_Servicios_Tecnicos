<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroMovíl - Sistema de Gestion de Servicios Tecnicos</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar.container">
            <div class="flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="logo" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a1 1 0 00-1.4-1.4l-1.6-1.6a1 1 0 00-1.4 0L14.7 6.3z M12.5 9.5L9 13l-2.5 2.5a6 6 0 008.5 8.5l2.5-2.5 3.5-3.5-4-4z" />
                </svg>
                <span class="title"><a href="index.html">ElectroMovíl</a></span>
            </div>
            <div class="menu">
                <a href="catalogo.html">Servicios</a>
                <a href="formulario.html">Solicitudes</a>
                <a href="admin.html">Ingreso Admin</a>
                <a href="login.html">Iniciar Sesión Cliente</a>
                <a href="index.html">Cerrar Sesión</a>
            </div>
            <button class="mobile-menu-button" id="mobileMenuButton">
                <svg xmlns="http://www.w3.org/2000/svg" class="menu-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
            <div class="mobile-menu" id="mobileMenu">
                <a href="catalogo.html">Servicios</a>
                <a href="formulario.html">Solicitudes</a>
                <a href="admin.html">Ingreso Admin</a>
                <a href="login.html">Iniciar Sesión Cliente</a>
            </div>
        </div>
        <script src="script.js"></script>
    </nav>
    <!-- Sección de módulo de pagos -->
    <section id="payments" class="payments-section">
        <div class="container">
            <h2 class="section-title">Módulo de Pagos</h2>
            
            <div class="payment-form-container">
                <div class="form-header">
                    <h3>Realizar Pago</h3>
                </div>
                <form id="paymentForm">
                    <div class="form-group">
                        <label>Seleccionar Factura</label>
                        <select id="invoiceSelect" class="form-select">
                            <option value="">Seleccione una factura...</option>
                            <option value="invoice-1001">Factura #1001 - Servicio: Instalación - Monto: $1.000.000</option>
                            <option value="invoice-1002">Factura #1002 - Servicio: Mantenimiento - Monto: $2.000.000</option>
                            <option value="invoice-1003">Factura #1003 - Servicio: Reparación - Monto: $750.000</option>
                            <option value="invoice-1004">Factura #1004 - Servicio: Reparación - Monto: $450.000</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>Monto a Pagar</label>
                        <div class="flex items-center">
                            <span class="currency-symbol">$</span>
                            <input type="text" id="amount" value="1,200.00" class="form-input" disabled>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Método de Pago</label>
                        <div class="payment-methods">
                            <label class="payment-method">
                                <input type="radio" name="payment_method" value="credit_card" checked>
                                <span>Tarjeta</span>
                            </label>
                            <label class="payment-method">
                                <input type="radio" name="payment_method" value="paypal">
                                <span>PayPal</span>
                            </label>
                            <label class="payment-method">
                                <input type="radio" name="payment_method" value="bank_transfer">
                                <span>Transferencia</span>
                            </label>
                            <label class="payment-method">
                                <input type="radio" name="payment_method" value="cash">
                                <span>Efectivo</span>
                            </label>
                        </div>
                    </div>
                    
                    <!-- Formulario de tarjeta de crédito -->
                    <div id="credit-card-form" class="credit-card-form">
                        <div class="grid">
                            <div>
                                <label>Nombre en la Tarjeta</label>
                                <input type="text" placeholder="Juan Pérez" class="form-input">
                            </div>
                            <div>
                                <label>Número de Tarjeta</label>
                                <input type="text" placeholder="1234 5678 9012 3456" class="form-input">
                            </div>
                            <div>
                                <label>Fecha de Expiración</label>
                                <input type="text" placeholder="MM/YY" class="form-input">
                            </div>
                            <div>
                                <label>CVV</label>
                                <input type="text" placeholder="123" class="form-input">
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <button type="submit" class="btn-primary"><a href="postpago.html">Realizar Pago</a></button>
                    </div>
                </form>
            </div>
            
        </div>
    </section>
</body>
</html>
