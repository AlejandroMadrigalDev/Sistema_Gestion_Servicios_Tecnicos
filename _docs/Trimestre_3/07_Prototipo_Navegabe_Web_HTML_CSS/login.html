<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroMovíl - Sistema de Gestion de Servicios Tecnicos</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <section id="login" class="py-16 bg-gray-50">
        <div class="container">
            <div class="max-w-md">
                <div class="header">
                    <h2>Inicio de Sesión</h2>
                </div>
                <form class="form" id="loginForm">
                        <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" required>
                    </div>
                    <button type="submit" class="btn-primary"><a href="catalogo.html">Iniciar Sesión</a></button>
                    <div class="mt-4 text-center">
                        <a href="#forgot-password" class="forgot-password-link">¿Olvidaste tu contraseña?</a>
                    </div>
                </form>
            </div>
            <div id="forgot-password" class="max-w-md hidden">
                <div class="header">
                    <h2>Recuperar Contraseña</h2>
                </div>
                <form class="form" id="recoveryForm">
                    <div class="form-group">
                        <label for="recovery-email">Correo Electrónico</label>
                        <input type="email" id="recovery-email" required>
                    </div>
                    <button type="submit" class="btn-primary">Enviar Enlace de Recuperación</button>
                    <div class="mt-4 text-center">
                        <a href="#login" class="forgot-password-link">Volver a Inicio de Sesión</a>
                    </div>
                </form>
            </div>
        </div>
    </section>
</body>
